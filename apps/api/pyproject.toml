[project]
name = "teammate-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "asyncpg",
    "workers-py",
    "workers-runtime-sdk",
    "pydantic",
    "pydantic-settings",
    "python-ulid",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "mypy",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
