[project]
name = "teammate-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "asyncpg",
    "PyJWT",
    "workers-py",
    "workers-runtime-sdk",
    "pydantic",
    "pydantic-settings",
    "python-ulid",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "mypy",
    "ruff",
]

[tool.uv]
package = true
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
# strict enables disallow_untyped_defs; disable it so test functions and
# fixtures do not need annotations. Server code is still fully checked.
disallow_untyped_defs = false
warn_unreachable = true
disallow_untyped_decorators = false
explicit_package_bases = true

# `workers` exists only inside the Cloudflare Workers runtime and has no stubs
# in a host venv. Scoped to that module rather than globally, so a genuinely
# untyped import elsewhere still fails.
[[tool.mypy.overrides]]
module = "workers.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `uv run pytest` runs in an isolated venv without the project root on
# sys.path, so `import server` fails there even when it works with a local
# `python -m pytest`.
pythonpath = ["."]
